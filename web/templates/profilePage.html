<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #fef3e2;
            color: #333;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            margin-top: 3vh;
            color: #e53935;
        }

        .profile-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px 20px;
            background-color: #fff;
            border: 2px solid #ffcc00;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .profile-container form {
            padding: 30px 25px 0px 25px;
            margin-bottom: 30px; 
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            width: 93%;
            padding: 10px;
            border: 2px solid #ffcc00;
            border-radius: 6px;
            background-color: #fff8e1;
            font-size: 14px;
            margin-bottom: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #e53935;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #d32f2f;
        }

        .header-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 20px 30px;
            background-color: #fff8e1;
            border-bottom: 2px solid #ffcc00;
        }

        .header-buttons form {
            margin: 0;
        }

        .header-buttons button {
            background-color: #e53935;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .header-buttons button:hover {
            background-color: #d32f2f;
        }
    </style>
    {{if .Flash}}
    <script>
        alert("{{.Flash}}");
    </script>
    {{end}}
</head>
<body>

    <header class="header-buttons">

        <form action="/main" method="GET">
            <button type="submit">Назад</button>
        </form>

    </header>

    <h1>Профиль пользователя {{.Username}}</h1>

    <div class="profile-container">
        <form method="POST" action="/change-username">
            <label for="newUsername">Новый логин</label>
            <input type="text" name="newUsername" placeholder="{{.Username}}" required>
            <button type="submit">Изменить</button>
        </form>

        <form method="POST" action="/change-password">
            <label for="oldPassword">Старый пароль</label>
            <input type="password" name="oldPassword" required>

            <label for="newPassword">Новый пароль</label>
            <input type="password" name="newPassword" required>

            <button type="submit">Сменить пароль</button>
        </form>

        <form action="/logout" method="POST">
            <button type="submit">Выйти</button>
        </form>
    </div>

</body>
</html>
