<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
</head>
<body>
    <h1>Вход</h1>

    {{if .Error}}
        <p style="color:red;">{{.Error}}</p>
    {{end}}

    <form action="/login" method="POST">
        <div>
            <label>Логин:</label>
            <input type="text" name="username" required>
        </div>
        <div>
            <label>Пароль:</label>
            <input type="password" name="password" required>
        </div>
        <div>
            <button type="submit">Войти</button>
        </div>
    </form>
</body>
</html>
